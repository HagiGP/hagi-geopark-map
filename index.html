<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>萩ジオパーク マップ</title>
  <meta name="description" content="萩ジオパークのジオサイト・地質・見どころをまとめたWeb地図" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#c30d23" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="萩ジオマップ" />
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <!-- 見出し・項目名を太くする書体（Noto Sans JP 700/900。使う文字の分だけ読み込まれる） -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" />
  <!-- 食と大地の判子の筆文字（使う字だけ） -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap&text=%E4%B8%B9%E5%A4%A7%E5%B8%83%E5%B9%B2%E6%9E%97%E6%9E%9C%E6%9F%91%E6%A0%B9%E6%A1%83%E6%AA%8E%E7%83%8F%E7%85%AE%E7%89%9B%E7%8E%89%E7%B1%B3%E8%85%90%E8%8B%A5%E8%8C%84%E8%91%B1%E8%92%B2%E8%95%83%E8%95%8E%E8%B1%86%E8%B3%8A%E9%85%92%E9%89%BE%E9%9B%B2%E9%AF%B5%E9%BA%A6" />
  <link rel="stylesheet" href="css/style.css?v=200" />
</head>
<body>
  <header id="appbar">
    <span id="brand" title="萩ジオパーク">
      <img id="brandLogo" src="img/logo-badge.png" alt="萩ジオパーク" draggable="false" />
    </span>
    <h1>萩ジオパーク マップ</h1>
    <button id="resetView" title="萩ジオパーク全体を見る">全体</button>
  </header>

  <!-- 4つのメニュー（横長＝左に縦1列、縦長＝下に横1列）。タップでパネルが開く -->
  <nav id="dock" aria-label="メニュー">
    <button class="dock-btn" data-tab="sites" aria-controls="panel"><span>みど</span><span>ころ</span></button>
    <button class="dock-btn" data-tab="areas" aria-controls="panel"><span>地域</span><span>解説</span></button>
    <button class="dock-btn" data-tab="food" aria-controls="panel"><span>食と</span><span>大地</span></button>
    <button class="dock-btn one" data-tab="legend" aria-controls="panel"><span>凡例</span></button>
  </nav>
  <aside id="panel" aria-hidden="true">
    <div class="panel-head">
      <strong id="panelTitle"></strong>
      <button id="panelClose" aria-label="閉じる">×</button>
    </div>
    <div class="panel-body">
      <section class="tab" data-tab="sites">
        <div id="poiList"><p class="loading">読み込み中…</p></div>
      </section>
      <section class="tab" data-tab="areas">
        <div id="areaList"></div>
      </section>
      <section class="tab" data-tab="site"><div id="siteDetail"></div></section>
      <section class="tab" data-tab="food"><p class="loading">読み込み中…</p></section>
      <section class="tab" data-tab="legend">
        <div id="legendBox"></div>
        <p class="credit">
          地形（陰影・傾斜）・地質・植生・海底地形の合成：萩ジオパーク推進協議会（QGIS）<br>
          地質：産総研 20万分の1日本シームレス地質図V2<br>
          植生：環境省 自然環境保全基礎調査<br>
          行政界・交通：国土数値情報／基盤地図情報<br>
          作成：萩ジオパーク推進協議会
        </p>
      </section>
    </div>
  </aside>

  <div id="map"></div>

  <script src="js/qrcode.min.js?v=58"></script>
  <script src="js/map.js?v=200"></script>
  <script src="js/tour.js?v=200"></script>
  <script src="js/food.js?v=200"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
    }
  </script>
</body>
</html>
